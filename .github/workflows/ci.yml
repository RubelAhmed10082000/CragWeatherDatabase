name: ci-frontend-only

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/Frontend/src
      API_BASE: https://crag-api-staging-898934496030.europe-west2.run.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Frontend/requirements.txt', 'Frontend/pyproject.toml') }}

      - name: Install deps
        run: |
          python -m pip install -U pip
          if [ -f Frontend/requirements.txt ]; then pip install -r Frontend/requirements.txt; fi
          python -m pip install pytest

      - name: Run Frontend tests
        run: |
          pytest -q Frontend/tests --maxfail=1 --durations=15
