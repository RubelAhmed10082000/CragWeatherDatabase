# pyproject.toml — Arquivio

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arquivio"
version = "0.1.0"
requires-python = ">=3.11"
description = "CragCast frontend + API"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -ra"


[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", ".venv", ".ruff_cache", ".pytest_cache", "dist", "node_modules", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203"] 


[tool.ruff.format]
# Black-compatible styling
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["arquivio"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]


